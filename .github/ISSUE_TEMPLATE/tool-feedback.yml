name: Tool feedback / ツールへの要望
description: A tool is hard for the AI to use, returns too much or too little, or you want a new tool or argument.
title: "[Tool] "
labels: ["tool-feedback"]
body:
  - type: textarea
    id: task
    attributes:
      label: What you were trying to do / やろうとしていたこと
      description: The design question you asked your AI, in your own words. / AI に訊いた設計の問い。
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What got in the way / 困ったこと
      description: e.g. the search found nothing for a word you would naturally use, the answer was too long, the AI called the same tool many times. / 例: 自然に使う語で検索が当たらない、返りが長すぎる、AI が同じツールを何度も呼んだ。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help / あると助かるもの
      description: Optional. / 任意。
